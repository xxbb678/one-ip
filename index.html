<!doctype html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />

  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>IP 查询与网络诊断</title>
  <meta name="description" content="IP 查询、网站分流、WebRTC 检测、全球 Ping、服务状态和 WHOIS 查询工具。" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    // ES2023 / iOS16 array helpers are missing on iOS 15 and older Safari.
    // Without these the app bundle throws on first call and renders a blank
    // page, so define the methods on the Array prototype before it runs.
    (function () {
      var p = Array.prototype;
      if (typeof p.toSorted !== "function") {
        p.toSorted = function (compare) {
          return this.slice().sort(compare);
        };
      }
      if (typeof p.toReversed !== "function") {
        p.toReversed = function () {
          return this.slice().reverse();
        };
      }
      if (typeof p.toSpliced !== "function") {
        p.toSpliced = function (start, skip) {
          var copy = this.slice();
          if (arguments.length === 0) return copy;
          var remove = skip === undefined ? 0 : skip;
          var items = Array.prototype.slice.call(arguments, 2);
          var args = [start, remove].concat(items);
          copy.splice.apply(copy, args);
          return copy;
        };
      }
      if (typeof p.with !== "function") {
        p.with = function (index, value) {
          var copy = this.slice();
          copy[index] = value;
          return copy;
        };
      }
      if (typeof Object.hasOwn !== "function") {
        Object.hasOwn = function (target, key) {
          return Object.prototype.hasOwnProperty.call(target, key);
        };
      }
      if (typeof globalThis.structuredClone !== "function") {
        globalThis.structuredClone = function (value) {
          return JSON.parse(JSON.stringify(value));
        };
      }
    })();
  </script>
  <script>
    // Classic ES5 script: IE cannot execute the application's module bundle.
    (function () {
      var root = document.documentElement;
      // Fallback only: production must also send frame-ancestors / X-Frame-Options.
      if (window.self !== window.top) {
        root.className = "embedded-browser";
        return;
      }
      if (document.documentMode || /MSIE|Trident/.test(navigator.userAgent)) {
        root.className = "unsupported-browser";
        return;
      }
      try {
        var theme = localStorage.getItem("theme") || "system";
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        ["color", "radius", "layout", "font-size"].forEach(function (key) {
          var value = localStorage.getItem("ui-" + key);
          if (value && value !== "default") root.setAttribute("data-" + key, value);
        });
      } catch (error) {
        // Keep the page usable when browser storage is unavailable.
      }
    })();
  </script>
  <style>
    html {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    .embedded-browser body {
      display: none !important;
    }

    #unsupported-browser {
      display: none;
    }

    .unsupported-browser #root {
      display: none;
    }

    .unsupported-browser #unsupported-browser {
      display: block;
      max-width: 640px;
      margin: 80px auto;
      padding: 24px;
      font-family: sans-serif;
      line-height: 1.8;
      color: #171717;
      background: #fff;
    }
  </style>
</head>

<body>
  <div id="unsupported-browser" role="alert">
    <h1>不支持 Internet Explorer</h1>
    <p>请使用最新版 Microsoft Edge、Google Chrome、Firefox 或 Safari 访问本站。</p>
    <a href="https://www.microsoft.com/edge">下载 Microsoft Edge</a>
  </div>
  <noscript>请启用 JavaScript，并使用现代浏览器访问本站。</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
